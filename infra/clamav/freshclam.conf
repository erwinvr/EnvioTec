# freshclam for EnvioTec (ADR-004, ADR-009): signatures only through the
# egress proxy, which allows database.clamav.net. No direct DNS lookups:
# the files network has no route to the internet.
DatabaseOwner clamav
DatabaseMirror database.clamav.net
ScriptedUpdates yes
DNSDatabaseInfo no
HTTPProxyServer egress-proxy
HTTPProxyPort 3128
Checks 12
LogTime yes
NotifyClamd /etc/clamav/clamd.conf
