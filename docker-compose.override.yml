# Development only. Docker Compose applies this file automatically with
# `docker compose up`. Never used in production or in scripts/check.sh.
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: dev
    image: enviotec/backend:dev
    command: ["node", "--watch", "src/server.js"]
    environment:
      NODE_ENV: development
      LOG_LEVEL: ${LOG_LEVEL:-debug}
    volumes:
      - ./backend/src:/app/src:ro

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: dev
    image: enviotec/backend:dev
    command: ["node", "--watch", "src/worker.js"]
    environment:
      NODE_ENV: development
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      # Real campaign sending through Mandrill (ADR-024): only the worker
      # holds the campaign key. Without this file, nothing is sent.
      MANDRILL_CAMPAIGNS_API_KEY_FILE: /run/secrets/mandrill_campaigns_api_key
    secrets: [database_url, redis_url_worker, mandrill_campaigns_api_key]
    volumes:
      - ./backend/src:/app/src:ro

  file-processor:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: dev
    image: enviotec/backend:dev
    command: ["node", "--watch", "src/file-processor.js"]
    environment:
      NODE_ENV: development
      LOG_LEVEL: ${LOG_LEVEL:-debug}
    volumes:
      - ./backend/src:/app/src:ro

  tools:
    environment:
      NODE_ENV: development

  # Database and Redis reachable from the host, on localhost only.
  postgres:
    ports: ["127.0.0.1:${POSTGRES_PORT:-5432}:5432"]
    networks: [data, public]

  redis:
    ports: ["127.0.0.1:${REDIS_PORT:-6379}:6379"]
    networks: [data, files, public]

secrets:
  mandrill_campaigns_api_key: { file: "${SECRETS_DIR:-./secrets}/mandrill_campaigns_api_key" }
