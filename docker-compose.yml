# EnvioTec — base stack (production-like). Development additions live in
# docker-compose.override.yml; the check environment in docker-compose.check.yml.
# No real secret lives here: every secret comes from files in ${SECRETS_DIR}.
name: enviotec

# Container logs rotate locally (the 12-month retention is the central log
# system's job, runbook section 7).
x-logging: &logging
  driver: json-file
  options: { max-size: "20m", max-file: "10" }

x-hardening: &hardening
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  restart: unless-stopped
  logging: *logging

# TLS to SQL Server: the server certificate is validated against the CA in
# the database_ca_cert secret, by the name DATABASE_SERVER_NAME (.env).
x-database-tls: &database-tls
  DATABASE_CA_CERT_FILE: /run/secrets/database_ca_cert
  DATABASE_SERVER_NAME: ${DATABASE_SERVER_NAME:-}

x-backend-build: &backend-build
  context: .
  dockerfile: backend/Dockerfile
  target: runtime

services:
  nginx:
    <<: *hardening
    build:
      context: .
      dockerfile: proxy/Dockerfile
    image: enviotec/nginx:local
    tmpfs: [/tmp]
    ports:
      - "${HTTPS_PORT:-443}:8443"
      - "${HTTP_PORT:-80}:8080"
    secrets: [tls_cert, tls_key]
    networks:
      public: {}
      edge:
        ipv4_address: ${NGINX_IP:-172.31.10.10}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/_nginx_health"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits: { cpus: "0.50", memory: 128M }

  backend:
    <<: *hardening
    build: *backend-build
    image: enviotec/backend:local
    init: true
    environment:
      <<: *database-tls
      NODE_ENV: production
      PORT: "3000"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL_FILE: /run/secrets/database_url
      REDIS_URL_FILE: /run/secrets/redis_url_backend
      CSRF_SECRET_FILE: /run/secrets/csrf_secret
      DATA_ENCRYPTION_KEY_FILE: /run/secrets/data_encryption_key
      TRUST_PROXY: ${NGINX_IP:-172.31.10.10}
      APP_ORIGIN: ${APP_ORIGIN:-https://localhost}
      AD_ENABLED: ${AD_ENABLED:-false}
      # fetch() (system mail through Mandrill) honors HTTPS_PROXY only with this flag.
      NODE_USE_ENV_PROXY: "1"
      HTTPS_PROXY: http://egress-proxy:3128
      NO_PROXY: redis,localhost,127.0.0.1
      FILES_DIR: /data/files
    volumes:
      - filestore:/data/files
    secrets: [database_url, database_ca_cert, redis_url_backend, csrf_secret, data_encryption_key]
    networks: [edge, data, egress, database]
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/health/live"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    stop_grace_period: 15s
    deploy:
      resources:
        limits: { cpus: "1.00", memory: 512M }

  worker:
    <<: *hardening
    build: *backend-build
    image: enviotec/backend:local
    init: true
    command: ["node", "src/worker.js"]
    environment:
      <<: *database-tls
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL_FILE: /run/secrets/database_url
      REDIS_URL_FILE: /run/secrets/redis_url_worker
      AD_ENABLED: ${AD_ENABLED:-false}
      # Campaign sending: set MANDRILL_CAMPAIGNS_API_KEY_FILE (Docker secret)
      # to enable it (ADR-005, ADR-024).
      NODE_USE_ENV_PROXY: "1"
      HTTPS_PROXY: http://egress-proxy:3128
      NO_PROXY: redis,localhost,127.0.0.1
      FILES_DIR: /data/files
    volumes:
      - filestore:/data/files
    secrets: [database_url, database_ca_cert, redis_url_worker]
    networks: [data, egress, database]
    depends_on:
      redis:
        condition: service_healthy
    stop_grace_period: 15s
    deploy:
      resources:
        limits: { cpus: "1.00", memory: 512M }

  # Untrusted files (ADR-004): CSV, .docx and PDF are inspected here, with no
  # database access, no database credentials and no internet. It only sees
  # Redis (its own ACL user, limited to the file queues) and ClamAV.
  file-processor:
    <<: *hardening
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: file-processor
    image: enviotec/file-processor:local
    init: true
    command: ["node", "src/file-processor.js"]
    tmpfs: [/tmp]
    environment:
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      REDIS_URL_FILE: /run/secrets/redis_url_files
      FILES_DIR: /data/files
      CLAMAV_HOST: clamav
    volumes:
      - filestore:/data/files
    secrets: [redis_url_files]
    networks: [files]
    depends_on:
      redis:
        condition: service_healthy
      clamav:
        condition: service_healthy
    stop_grace_period: 15s
    deploy:
      resources:
        limits: { cpus: "1.00", memory: 512M }

  # Antivirus (ADR-004). Signatures are updated by freshclam through the
  # egress proxy (ADR-009, ADR-015).
  clamav:
    logging: *logging
    image: clamav/clamav:1.5.4@sha256:bda39705e291105049c3936e2803ac90b955172af8030f94f05dce1252df6c6d
    restart: unless-stopped
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    # The image starts as root to prepare its directories and then runs
    # freshclam and clamd as the clamav user.
    cap_add: [CHOWN, SETUID, SETGID, DAC_OVERRIDE, FOWNER]
    tmpfs: [/tmp, /run, /run/clamav, /var/log/clamav]
    volumes:
      - clamavdb:/var/lib/clamav
      - ./infra/clamav/freshclam.conf:/etc/clamav/freshclam.conf:ro
    networks: [files, egress]
    depends_on:
      egress-proxy:
        condition: service_healthy
    deploy:
      resources:
        limits: { cpus: "1.00", memory: 2G }

  # One-off tasks (ADR-017, ADR-032): provisioning, migrations, seeds and
  # bootstrap, with the owner login. Not started by `docker compose up`:
  #   docker compose run --rm tools node scripts/migrate.js up
  tools:
    <<: *hardening
    restart: "no"
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: tools
    image: enviotec/tools:local
    profiles: [tools]
    tmpfs: [/tmp]
    environment:
      <<: *database-tls
      NODE_ENV: production
      MIGRATION_DATABASE_URL_FILE: /run/secrets/migration_database_url
    secrets: [migration_database_url, database_ca_cert]
    networks: [database]

  redis:
    <<: *hardening
    image: redis:8.10.3-alpine3.23@sha256:21090af93f8324db2f0f0f4f38a7c60369d47d917e000c3423d89d2ae2883537
    user: redis
    entrypoint: ["sh", "/usr/local/etc/redis/start.sh"]
    volumes:
      - redisdata:/data
      - ./infra/redis/start.sh:/usr/local/etc/redis/start.sh:ro
    tmpfs: [/tmp]
    secrets: [redis_backend_password, redis_worker_password, redis_files_password]
    networks: [data, files]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --user healthcheck --pass healthcheck --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits: { cpus: "0.50", memory: 384M }

  egress-proxy:
    <<: *hardening
    build: ./infra/egress-proxy
    image: enviotec/egress-proxy:local
    tmpfs: [/tmp, /var/cache/squid, /var/log/squid, /var/run/squid]
    networks: [egress, outbound]
    healthcheck:
      # A plain HTTP request must be denied (403): proves squid applies its rules.
      test: ["CMD-SHELL", "printf 'GET http://healthcheck/ HTTP/1.0\\r\\n\\r\\n' | nc -w 3 127.0.0.1 3128 | head -n 1 | grep -q ' 403 '"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits: { cpus: "0.50", memory: 128M }

networks:
  # Published ports need a non-internal network. Only nginx joins it.
  public: {}
  # Only the egress proxy has a route to the internet.
  outbound: {}
  edge:
    internal: true
    ipam:
      config:
        - subnet: ${EDGE_SUBNET:-172.31.10.0/24}
  data:
    internal: true
  egress:
    internal: true
  # file-processor, ClamAV and Redis only (ADR-004).
  files:
    internal: true
  # Route to the organization's SQL Server (ADR-032). Not internal: the host
  # firewall allows it only to the database server, port 1433.
  database: {}

volumes:
  redisdata: {}
  # Private file store: incoming (quarantine) and results. Never served by nginx.
  filestore: {}
  clamavdb: {}

secrets:
  database_url: { file: "${SECRETS_DIR:-./secrets}/database_url" }
  database_ca_cert: { file: "${SECRETS_DIR:-./secrets}/database_ca_cert" }
  migration_database_url: { file: "${SECRETS_DIR:-./secrets}/migration_database_url" }
  redis_backend_password: { file: "${SECRETS_DIR:-./secrets}/redis_backend_password" }
  redis_worker_password: { file: "${SECRETS_DIR:-./secrets}/redis_worker_password" }
  redis_url_backend: { file: "${SECRETS_DIR:-./secrets}/redis_url_backend" }
  redis_url_worker: { file: "${SECRETS_DIR:-./secrets}/redis_url_worker" }
  redis_files_password: { file: "${SECRETS_DIR:-./secrets}/redis_files_password" }
  redis_url_files: { file: "${SECRETS_DIR:-./secrets}/redis_url_files" }
  csrf_secret: { file: "${SECRETS_DIR:-./secrets}/csrf_secret" }
  data_encryption_key: { file: "${SECRETS_DIR:-./secrets}/data_encryption_key" }
  tls_cert: { file: "${SECRETS_DIR:-./secrets}/tls_cert" }
  tls_key: { file: "${SECRETS_DIR:-./secrets}/tls_key" }
