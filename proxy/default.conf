server_tokens off;

upstream backend {
    server backend:3000;
    keepalive 16;
}

# HTTP: only the container healthcheck and a redirect to HTTPS.
server {
    listen 8080;

    location = /_nginx_health {
        access_log off;
        allow 127.0.0.1;
        deny all;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 8443 ssl;
    http2 on;

    ssl_certificate /run/secrets/tls_cert;
    ssl_certificate_key /run/secrets/tls_key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:TLS:10m;
    ssl_session_tickets off;

    client_max_body_size 1m;
    client_body_timeout 15s;
    client_header_timeout 15s;
    send_timeout 30s;

    include /etc/nginx/snippets/security-headers.conf;

    root /usr/share/nginx/html;

    location /api/ {
        include /etc/nginx/snippets/proxy-backend.conf;
    }

    # Template preview: its own headers (ADR-012). The backend's sandbox CSP
    # passes through; the app's global CSP and X-Frame-Options DENY do not
    # apply here, or the preview could not be framed.
    location ~ ^/api/v1/templates/[0-9a-f-]+/versions/[0-9]+/preview$ {
        include /etc/nginx/snippets/preview-headers.conf;
        include /etc/nginx/snippets/proxy-backend.conf;
    }

    # Uploads (CSV, .docx, PDF): a larger body only here; the backend applies
    # the exact limit of each file type (ADR-004).
    location ~ ^/api/v1/(lists/[0-9a-f-]+/imports|templates/[0-9a-f-]+/versions|campaigns/[0-9a-f-]+/attachment)$ {
        client_max_body_size 12m;
        client_body_timeout 60s;
        include /etc/nginx/snippets/proxy-backend.conf;
    }

    location /health/ {
        include /etc/nginx/snippets/proxy-backend.conf;
    }

    # ES modules: always revalidated (ETag), so a deploy is picked up at once.
    location /src/ {
        etag on;
        expires -1;
        try_files $uri =404;
    }

    location = /index.html {
        expires -1;
    }

    location / {
        expires -1;
        try_files $uri /index.html;
    }
}
