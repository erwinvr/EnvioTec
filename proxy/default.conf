server_tokens off;

upstream backend {
    server backend:3000;
    keepalive 16;
}

# HTTP: only the container healthcheck and a redirect to HTTPS.
server {
    listen 8080;

    location = /_nginx_health {
        access_log off;
        allow 127.0.0.1;
        deny all;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 8443 ssl;
    http2 on;

    ssl_certificate /run/secrets/tls_cert;
    ssl_certificate_key /run/secrets/tls_key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:TLS:10m;
    ssl_session_tickets off;

    client_max_body_size 1m;
    client_body_timeout 15s;
    client_header_timeout 15s;
    send_timeout 30s;

    include /etc/nginx/snippets/security-headers.conf;

    root /usr/share/nginx/html;

    location /api/ {
        include /etc/nginx/snippets/proxy-backend.conf;
    }

    location /health/ {
        include /etc/nginx/snippets/proxy-backend.conf;
    }

    location /src/ {
        try_files $uri =404;
    }

    location = /index.html {
        expires -1;
    }

    location / {
        expires -1;
        try_files $uri /index.html;
    }
}
