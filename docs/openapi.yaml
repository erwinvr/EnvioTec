openapi: 3.1.0
info:
  title: EnvioTec API
  version: 0.6.0
  description: |
    API interna de EnvioTec. Todas las respuestas usan el formato único:
    `{ success: true, data, meta? }` o `{ success: false, error: { code, message, details?, requestId } }`.
    Cada respuesta incluye `X-Request-Id` (generado por el servidor) y `Cache-Control: no-store`.

    **CSRF:** todo POST, PUT, PATCH y DELETE debe llevar el header `Origin` de la aplicación; con sesión,
    también `X-CSRF-Token` (lo devuelven el login y `GET /api/v1/auth/me`). Sin ellos responde 403 `CSRF_REJECTED`.

    **Etapas de la sesión (ADR-018):** `mfa_verify`, `password_change`, `mfa_enroll` y `full`. Fuera de las etapas que
    acepta cada ruta (`x-enviotec-stages`, por defecto `full`), responde 403 `AUTH_STEP_REQUIRED`.

    `x-enviotec-authenticated: true` indica una ruta sobre la propia cuenta: requiere sesión, no un permiso.
servers:
  - url: /
security:
  - session: []
paths:
  /api/v1/auth/login:
    post:
      summary: Iniciar sesión (cuenta local o de AD)
      description: |
        Mismo error (401 `INVALID_CREDENTIALS`) para usuario inexistente, contraseña incorrecta y cuenta bloqueada,
        desactivada o vencida. Rate limiting por IP y por cuenta (429 con `Retry-After`). Crea la sesión en la cookie
        `__Host-enviotec_session` y revoca la que traía la petición. Las cuentas de AD se crean en el primer login.
      operationId: login
      security: []
      x-enviotec-public: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [username, password]
              properties:
                username: { type: string, pattern: '^[A-Za-z0-9._-]{3,64}$' }
                password: { type: string, minLength: 1, maxLength: 256 }
      responses:
        '200': { $ref: '#/components/responses/SessionState' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /api/v1/auth/logout:
    post:
      summary: Cerrar la sesión (se revoca en el servidor)
      operationId: logout
      x-enviotec-authenticated: true
      x-enviotec-stages: [mfa_verify, password_change, mfa_enroll, full]
      responses:
        '200': { $ref: '#/components/responses/Empty' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
  /api/v1/auth/me:
    get:
      summary: Estado de la sesión, usuario, permisos efectivos y token CSRF
      description: Los permisos solo se devuelven en la etapa `full`.
      operationId: me
      x-enviotec-authenticated: true
      x-enviotec-stages: [mfa_verify, password_change, mfa_enroll, full]
      responses:
        '200': { $ref: '#/components/responses/SessionState' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
  /api/v1/auth/mfa/verify:
    post:
      summary: Verificar el MFA con un código TOTP o un código de recuperación
      description: Rota el token de sesión. Cinco códigos incorrectos en una sesión la revocan.
      operationId: mfaVerify
      x-enviotec-authenticated: true
      x-enviotec-stages: [mfa_verify]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              oneOf: [{ required: [code] }, { required: [recoveryCode] }]
              properties:
                code: { type: string, pattern: '^[0-9]{6}$' }
                recoveryCode: { type: string, example: ABCDE-FGHIJ }
      responses:
        '200': { $ref: '#/components/responses/SessionState' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /api/v1/auth/mfa/enroll/start:
    post:
      summary: Iniciar la configuración del MFA
      description: |
        Devuelve el secreto y la URI otpauth (para el QR). Las cuentas de AD necesitan el código de enrolamiento
        que emite un administrador. Fuera del primer login exige re-autenticación.
      operationId: mfaEnrollStart
      x-enviotec-authenticated: true
      x-enviotec-stages: [mfa_enroll, full]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                enrollmentCode: { type: string, example: ABCD-EFGH-IJKL-MNOP }
      responses:
        '200':
          description: Secreto pendiente de confirmación (10 minutos)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, const: true }
                  data:
                    type: object
                    properties:
                      secret: { type: string }
                      otpauthUri: { type: string }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /api/v1/auth/mfa/enroll/confirm:
    post:
      summary: Confirmar el MFA con un código; devuelve 10 códigos de recuperación (se muestran una sola vez)
      operationId: mfaEnrollConfirm
      x-enviotec-authenticated: true
      x-enviotec-stages: [mfa_enroll, full]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [code]
              properties:
                code: { type: string, pattern: '^[0-9]{6}$' }
      responses:
        '200':
          description: MFA configurado; el token de sesión se rota
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, const: true }
                  data:
                    type: object
                    properties:
                      recoveryCodes: { type: array, items: { type: string } }
                      session: { $ref: '#/components/schemas/SessionState' }
        '422': { $ref: '#/components/responses/Error' }
  /api/v1/auth/password/change:
    post:
      summary: Cambiar la propia contraseña (solo cuentas locales)
      description: Revoca las demás sesiones y rota la actual.
      operationId: passwordChange
      x-enviotec-authenticated: true
      x-enviotec-stages: [password_change, full]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [currentPassword, newPassword]
              properties:
                currentPassword: { type: string }
                newPassword: { type: string, description: 12 a 128 caracteres; se rechazan contraseñas comunes }
      responses:
        '200': { $ref: '#/components/responses/SessionState' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /api/v1/auth/password/forgot:
    post:
      summary: Pedir un enlace de recuperación (solo cuentas locales)
      description: Responde 202 igual exista o no la cuenta.
      operationId: passwordForgot
      security: []
      x-enviotec-public: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email]
              properties:
                email: { type: string }
      responses:
        '202': { $ref: '#/components/responses/Empty' }
        '429': { $ref: '#/components/responses/Error' }
  /api/v1/auth/password/reset:
    post:
      summary: Definir una nueva contraseña con el token del correo (un solo uso, 30 minutos)
      description: Revoca todas las sesiones del usuario.
      operationId: passwordReset
      security: []
      x-enviotec-public: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token, newPassword]
              properties:
                token: { type: string, pattern: '^[A-Za-z0-9_-]{43}$' }
                newPassword: { type: string }
      responses:
        '200': { $ref: '#/components/responses/Empty' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /api/v1/auth/reauth:
    post:
      summary: Re-autenticarse con la contraseña o un código TOTP (vale 5 minutos)
      operationId: reauth
      x-enviotec-authenticated: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              oneOf: [{ required: [password] }, { required: [code] }]
              properties:
                password: { type: string }
                code: { type: string, pattern: '^[0-9]{6}$' }
      responses:
        '200': { $ref: '#/components/responses/Empty' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /api/v1/auth/sessions:
    get:
      summary: Sesiones activas del propio usuario
      operationId: listOwnSessions
      x-enviotec-authenticated: true
      responses:
        '200':
          description: Sesiones
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, const: true }
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, description: Hash SHA-256 del token en hexadecimal }
                        createdAt: { type: string, format: date-time }
                        lastSeenAt: { type: string, format: date-time }
                        expiresAt: { type: string, format: date-time }
                        ip: { type: [string, 'null'] }
                        userAgent: { type: [string, 'null'] }
                        current: { type: boolean }
  /api/v1/auth/sessions/{id}:
    delete:
      summary: Cerrar una sesión propia
      description: Una sesión de otro usuario responde 404, igual que una inexistente.
      operationId: revokeOwnSession
      x-enviotec-authenticated: true
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, pattern: '^[0-9a-f]{64}$' } }
      responses:
        '200': { $ref: '#/components/responses/Empty' }
        '404': { $ref: '#/components/responses/Error' }
  /api/v1/users:
    get:
      summary: Listar usuarios (alcance por área sin areas.view_all)
      operationId: listUsers
      x-enviotec-permission: users.view
      parameters:
        - { name: search, in: query, schema: { type: string, maxLength: 100 } }
        - { name: status, in: query, schema: { type: string, enum: [active, disabled, locked] } }
        - { name: authSource, in: query, schema: { type: string, enum: [local, ad] } }
        - { name: areaId, in: query, schema: { type: string, format: uuid } }
        - { name: roleId, in: query, schema: { type: string, format: uuid } }
        - { name: sort, in: query, schema: { type: string, enum: [username, displayName, createdAt, lastLoginAt, expiresAt], default: username } }
        - { name: direction, in: query, schema: { type: string, enum: [asc, desc], default: asc } }
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
      responses:
        '200': { $ref: '#/components/responses/UserList' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Error' }
    post:
      summary: Crear una cuenta local
      description: Devuelve una contraseña temporal de 20 caracteres que se muestra una sola vez; el usuario la cambia en su primer login. Vigencia por defecto y máxima según system_settings.
      operationId: createLocalUser
      x-enviotec-permission: users.create_local
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [username, email, displayName, areaId]
              properties:
                username: { type: string, pattern: '^[A-Za-z0-9._-]{3,64}$' }
                email: { type: string }
                displayName: { type: string }
                areaId: { type: string, format: uuid }
                expiresAt: { type: string, format: date-time }
      responses:
        '201': { description: Usuario y contraseña temporal }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /api/v1/users/review/local:
    get:
      summary: 'Revisión de cuentas locales activas: último acceso, vencimiento e inactividad'
      operationId: reviewLocalUsers
      x-enviotec-permission: users.view
      responses:
        '200': { description: Cuentas locales activas }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/users/{id}:
    get:
      summary: 'Detalle de un usuario (fuera del alcance: 404)'
      operationId: getUser
      x-enviotec-permission: users.view
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { $ref: '#/components/responses/User' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/Error' }
    patch:
      summary: Editar nombre, email o área de una cuenta local
      description: Cambiar el email exige re-autenticación. Las cuentas de AD responden 409.
      operationId: updateUser
      x-enviotec-permission: users.update
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                displayName: { type: string }
                email: { type: string }
                areaId: { type: string, format: uuid }
      responses:
        '200': { $ref: '#/components/responses/User' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /api/v1/users/{id}/disable:
    post:
      summary: Desactivar un usuario (revoca sus sesiones)
      description: Re-autenticación. No a uno mismo ni al último superadmin activo.
      operationId: disableUser
      x-enviotec-permission: users.disable
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { $ref: '#/components/responses/User' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /api/v1/users/{id}/enable:
    post:
      summary: Reactivar un usuario
      description: Re-autenticación. Una cuenta local vencida se reactiva con una renovación.
      operationId: enableUser
      x-enviotec-permission: users.disable
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { $ref: '#/components/responses/User' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /api/v1/users/{id}/unlock:
    post:
      summary: Quitar el bloqueo temporal
      operationId: unlockUser
      x-enviotec-permission: users.unlock
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { $ref: '#/components/responses/User' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /api/v1/users/{id}/reset-password:
    post:
      summary: Generar una contraseña temporal (solo cuentas locales)
      description: Re-autenticación. Obliga a cambiarla y revoca las sesiones.
      operationId: resetUserPassword
      x-enviotec-permission: users.reset_password
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { $ref: '#/components/responses/User' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /api/v1/users/{id}/renew:
    post:
      summary: Renovar la vigencia de una cuenta local
      description: Re-autenticación y motivo obligatorio; hasta renewal_max_days y nunca más allá de max_validity_days desde hoy. Nadie renueva su propia cuenta. Reactiva si estaba desactivada por vencimiento o inactividad.
      operationId: renewUser
      x-enviotec-permission: users.renew_local
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [days, reason]
              properties:
                days: { type: integer, minimum: 1 }
                reason: { type: string, minLength: 10, maxLength: 500 }
      responses:
        '200': { $ref: '#/components/responses/User' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /api/v1/users/{id}/roles:
    put:
      summary: Reemplazar los roles manuales de un usuario
      description: Re-autenticación. 403 PRIVILEGE_ESCALATION (auditado) si un rol agregado o quitado tiene permisos que el actor no tiene; 409 sobre los propios roles o el último superadmin; 422 para un rol administrativo en una cuenta de AD o un rol que asigna un grupo de AD. Revoca las sesiones del usuario.
      operationId: replaceUserRoles
      x-enviotec-permission: roles.assign
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [roleIds]
              properties:
                roleIds: { type: array, maxItems: 50, items: { type: string, format: uuid } }
      responses:
        '200': { $ref: '#/components/responses/User' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /api/v1/users/{id}/sessions:
    get:
      summary: Sesiones activas de un usuario
      operationId: listUserSessions
      x-enviotec-permission: sessions.view_any
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Sesiones }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    delete:
      summary: Revocar todas las sesiones de un usuario
      operationId: revokeUserSessions
      x-enviotec-permission: sessions.revoke_any
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Cantidad revocada }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/areas:
    get:
      summary: Áreas (nombres para cualquier usuario; el department de AD solo con areas.manage)
      operationId: listAreas
      x-enviotec-authenticated: true
      responses:
        '200': { description: Áreas }
        '401': { $ref: '#/components/responses/Unauthenticated' }
    post:
      summary: Crear un área
      operationId: createArea
      x-enviotec-permission: areas.manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name: { type: string, minLength: 2, maxLength: 100 }
                adDepartment: { type: [string, 'null'] }
      responses:
        '201': { description: Área creada }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /api/v1/areas/{id}:
    patch:
      summary: Modificar un área (las áreas no se borran)
      operationId: updateArea
      x-enviotec-permission: areas.manage
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name: { type: string }
                adDepartment: { type: [string, 'null'] }
                isActive: { type: boolean }
      responses:
        '200': { description: Área }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /api/v1/users/{id}/mfa/reset:
    post:
      summary: Reiniciar el MFA de un usuario (revoca sus sesiones)
      description: |
        Exige re-autenticación (403 `REAUTH_REQUIRED`). Para cuentas de AD emite además el código de enrolamiento,
        que se muestra una sola vez. Nadie reinicia su propio MFA (409).
      operationId: resetUserMfa
      x-enviotec-permission: users.reset_mfa
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: MFA reiniciado
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, const: true }
                  data:
                    type: object
                    properties:
                      enrollmentCode: { type: [string, 'null'] }
                      expiresAt: { type: [string, 'null'], format: date-time }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /api/v1/roles:
    get:
      summary: 'Listar roles'
      operationId: listRoles
      x-enviotec-permission: roles.view
      responses:
        '200': { description: Roles }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      summary: 'Crear un rol'
      description: 'Con permisos iniciales exige re-autenticación; solo con permisos que el creador tiene (403 PRIVILEGE_ESCALATION, auditado).'
      operationId: createRole
      x-enviotec-permission: roles.create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name: { type: string, pattern: '^[a-z][a-z0-9_-]{1,49}$' }
                description: { type: string, maxLength: 500 }
                permissions: { type: array, items: { type: string, example: campaigns.view } }
      responses:
        '201': { description: Rol creado }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /api/v1/roles/{id}:
    get:
      summary: 'Detalle de un rol con permisos y grupos de AD'
      operationId: getRole
      x-enviotec-permission: roles.view
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Rol }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
    patch:
      summary: 'Renombrar o describir un rol (el de sistema no se renombra)'
      operationId: updateRole
      x-enviotec-permission: roles.update
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name: { type: string }
                description: { type: string }
      responses:
        '200': { description: Rol }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
    delete:
      summary: 'Borrar un rol sin usuarios ni grupos de AD (el de sistema no se borra)'
      description: 'Exige re-autenticación.'
      operationId: deleteRole
      x-enviotec-permission: roles.delete
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Borrado }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /api/v1/roles/{id}/permissions:
    put:
      summary: 'Reemplazar los permisos de un rol'
      description: 'Exige re-autenticación. 409 para el rol de sistema o un rol que el actor tiene; 403 PRIVILEGE_ESCALATION (auditado) para permisos que el actor no tiene; 422 para un permiso administrativo en un rol usado desde AD. Revoca las sesiones de los usuarios del rol.'
      operationId: replaceRolePermissions
      x-enviotec-permission: roles.update
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [permissions]
              properties:
                permissions: { type: array, items: { type: string, example: campaigns.view } }
      responses:
        '200': { description: Rol }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /api/v1/users/{id}/permissions:
    get:
      summary: 'Permisos efectivos de un usuario y si exige MFA'
      operationId: getUserEffectivePermissions
      x-enviotec-permission: users.view
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Permisos con los roles que los otorgan }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/Error' }
  /api/v1/directory/mappings:
    get:
      summary: 'Equivalencias de grupos de AD a roles'
      operationId: listDirectoryMappings
      x-enviotec-permission: directory.manage
      responses:
        '200': { description: Equivalencias }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      summary: 'Asociar un grupo de AD a un rol de negocio'
      description: 'DN validado; con AD habilitado el grupo debe existir. Los roles administrativos se rechazan. Se aplica en el siguiente login o revisión de AD.'
      operationId: createDirectoryMapping
      x-enviotec-permission: directory.manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [groupDn, roleId]
              properties:
                groupDn: { type: string, maxLength: 500 }
                roleId: { type: string, format: uuid }
      responses:
        '201': { description: Equivalencia creada }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /api/v1/directory/mappings/{id}:
    delete:
      summary: 'Quitar una equivalencia'
      operationId: deleteDirectoryMapping
      x-enviotec-permission: directory.manage
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Quitada }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /api/v1/settings:
    get:
      summary: 'Parámetros del sistema'
      operationId: listSettings
      x-enviotec-permission: settings.manage
      responses:
        '200': { description: Parámetros con valor, tipo, rango y descripción }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/settings/{key}:
    patch:
      summary: 'Cambiar un parámetro del sistema'
      description: 'Exige re-autenticación. Valida rango, formato de listas y coherencia entre parámetros. Auditado con el valor anterior y el nuevo.'
      operationId: updateSetting
      x-enviotec-permission: settings.manage
      parameters:
        - { name: key, in: path, required: true, schema: { type: string, example: local_account.max_validity_days } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [value]
              properties:
                value: { oneOf: [{ type: integer }, { type: array, items: { type: string } }] }
      responses:
        '200': { description: Parámetro }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /api/v1/audit-logs:
    get:
      summary: Consultar la auditoría (vista global, sin filtro por área)
      description: Ordenada por fecha descendente. Página máxima de 100 y desplazamiento máximo de 10.000 registros.
      operationId: listAuditLogs
      x-enviotec-permission: audit.view
      parameters:
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { name: actorUserId, in: query, schema: { type: string, format: uuid } }
        - { name: action, in: query, schema: { type: string, example: auth.login } }
        - { name: resourceType, in: query, schema: { type: string } }
        - { name: resourceId, in: query, schema: { type: string } }
        - { name: result, in: query, schema: { type: string, enum: [success, denied, failure] } }
        - { name: requestId, in: query, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200':
          description: Eventos
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, const: true }
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, format: uuid }
                        occurredAt: { type: string, format: date-time }
                        actorType: { type: string, enum: [user, system, anonymous] }
                        actorUserId: { type: [string, 'null'] }
                        actorUsername: { type: [string, 'null'] }
                        action: { type: string }
                        resourceType: { type: [string, 'null'] }
                        resourceId: { type: [string, 'null'] }
                        result: { type: string, enum: [success, denied, failure] }
                        ip: { type: [string, 'null'] }
                        userAgent: { type: [string, 'null'] }
                        requestId: { type: [string, 'null'] }
                        metadata: { type: object }
                  meta:
                    type: object
                    properties:
                      total: { type: integer }
                      page: { type: integer }
                      pageSize: { type: integer }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Error' }
  /api/v1/audit-logs/export:
    get:
      summary: Exportar la auditoría en CSV
      description: |
        Exige re-autenticación (403 `REAUTH_REQUIRED`) y un rango `from`/`to` de hasta 92 días; como máximo 100.000
        registros (422 `too_many_rows`). CSV UTF-8 con BOM, celdas entrecomilladas y fórmulas neutralizadas.
        La exportación queda auditada con sus filtros y la cantidad de filas.
      operationId: exportAuditLogs
      x-enviotec-permission: audit.export
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date-time } }
        - { name: to, in: query, required: true, schema: { type: string, format: date-time } }
        - { name: actorUserId, in: query, schema: { type: string, format: uuid } }
        - { name: action, in: query, schema: { type: string } }
        - { name: resourceType, in: query, schema: { type: string } }
        - { name: resourceId, in: query, schema: { type: string } }
        - { name: result, in: query, schema: { type: string, enum: [success, denied, failure] } }
        - { name: requestId, in: query, schema: { type: string } }
      responses:
        '200':
          description: Archivo CSV
          content:
            text/csv:
              schema: { type: string }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Error' }
  /api/v1/permissions:
    get:
      summary: Catálogo de permisos
      description: Catálogo completo (pequeño y fijo, cargado por seed), sin paginación.
      operationId: listPermissions
      x-enviotec-permission: permissions.view
      responses:
        '200':
          description: Catálogo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PermissionList'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
  /health/live:
    get:
      summary: El proceso está vivo
      operationId: healthLive
      security: []
      x-enviotec-public: true
      responses:
        '200':
          description: Vivo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthLive'
  /health/ready:
    get:
      summary: El backend puede atender (PostgreSQL y Redis responden)
      description: No indica qué dependencia falló; eso queda en los logs del servidor.
      operationId: healthReady
      security: []
      x-enviotec-public: true
      responses:
        '200':
          description: Listo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthReady'
        '503':
          description: Alguna dependencia no está disponible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: __Host-enviotec_session
      description: Token de sesión opaco (ADR-002). En la base solo se guarda su hash SHA-256.
  responses:
    SessionState:
      description: Estado de la sesión
      content:
        application/json:
          schema:
            type: object
            properties:
              success: { type: boolean, const: true }
              data: { $ref: '#/components/schemas/SessionState' }
    Empty:
      description: Operación realizada
      content:
        application/json:
          schema:
            type: object
            properties:
              success: { type: boolean, const: true }
              data: { type: object, additionalProperties: false }
    User:
      description: Usuario
      content:
        application/json:
          schema:
            type: object
            properties:
              success: { type: boolean, const: true }
              data: { $ref: '#/components/schemas/User' }
    UserList:
      description: Usuarios
      content:
        application/json:
          schema:
            type: object
            properties:
              success: { type: boolean, const: true }
              data: { type: array, items: { $ref: '#/components/schemas/User' } }
              meta: { type: object, properties: { total: { type: integer }, page: { type: integer }, pageSize: { type: integer } } }
    Error:
      description: Error con el formato estándar
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthenticated:
      description: Sin sesión válida (ausente, revocada, vencida o de un usuario inactivo)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: La sesión no tiene el permiso requerido
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    User:
      type: object
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        email: { type: string }
        displayName: { type: string }
        authSource: { type: string, enum: [local, ad] }
        areaId: { type: [string, 'null'] }
        areaName: { type: [string, 'null'] }
        status: { type: string, enum: [active, disabled, locked] }
        disabledReason: { type: [string, 'null'], enum: [manual, expired, inactive, null] }
        mustChangePassword: { type: boolean }
        mfaEnabled: { type: boolean }
        lockedUntil: { type: [string, 'null'], format: date-time }
        expiresAt: { type: [string, 'null'], format: date-time }
        exemptFromExpiry: { type: boolean }
        isEmergency: { type: boolean }
        lastLoginAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
        roles:
          type: array
          items: { type: object, properties: { id: { type: string }, name: { type: string }, source: { type: string, enum: [manual, ad_group] } } }
    SessionState:
      type: object
      additionalProperties: false
      required: [stage, csrfToken, sessionExpiresAt, mfaRequired, user, permissions]
      properties:
        stage: { type: string, enum: [mfa_verify, password_change, mfa_enroll, full] }
        csrfToken: { type: string, description: Enviar en X-CSRF-Token }
        sessionExpiresAt: { type: string, format: date-time }
        mfaRequired: { type: boolean }
        user:
          type: object
          additionalProperties: false
          properties:
            id: { type: string, format: uuid }
            username: { type: string }
            email: { type: string }
            displayName: { type: string }
            authSource: { type: string, enum: [local, ad] }
            areaId: { type: [string, 'null'], format: uuid }
            mfaEnabled: { type: boolean }
        permissions: { type: array, items: { type: string } }
    PermissionList:
      type: object
      additionalProperties: false
      required: [success, data, meta]
      properties:
        success: { type: boolean, const: true }
        data:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [code, description, administrative]
            properties:
              code: { type: string, example: users.view }
              description: '{ type: string }'
              administrative: { type: boolean, description: Exige MFA y solo se asigna a cuentas locales }
        meta:
          type: object
          additionalProperties: false
          required: [total]
          properties:
            total: { type: integer }
    HealthLive:
      type: object
      additionalProperties: false
      required: [success, data]
      properties:
        success: { type: boolean, const: true }
        data:
          type: object
          additionalProperties: false
          required: [status]
          properties:
            status: { type: string, enum: [ok] }
    HealthReady:
      type: object
      additionalProperties: false
      required: [success, data]
      properties:
        success: { type: boolean, const: true }
        data:
          type: object
          additionalProperties: false
          required: [status]
          properties:
            status: { type: string, enum: [ready] }
    Error:
      type: object
      required: [success, error]
      properties:
        success: { type: boolean, const: false }
        error:
          type: object
          required: [code, message, requestId]
          properties:
            code:
              type: string
              enum: [VALIDATION_ERROR, BAD_REQUEST, AUTHENTICATION_REQUIRED, INVALID_CREDENTIALS, FORBIDDEN,
                     AUTH_STEP_REQUIRED, REAUTH_REQUIRED, PRIVILEGE_ESCALATION, CSRF_REJECTED, NOT_FOUND, CONFLICT, PAYLOAD_TOO_LARGE,
                     UNSUPPORTED_MEDIA_TYPE, RATE_LIMITED, INTERNAL_ERROR, SERVICE_UNAVAILABLE]
            message: { type: string }
            requestId: { type: string, format: uuid }
            details:
              type: array
              items:
                type: object
                required: [field, code]
                properties:
                  field: { type: string }
                  code: { type: string }
                  location: { type: string, enum: [body, querystring, params, headers] }
