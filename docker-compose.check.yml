# Check environment for scripts/check.sh: the production-like stack without
# published ports, plus a test container that reaches every internal network.
services:
  nginx:
    ports: !reset []

  tests:
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: dev
    image: enviotec/backend:dev
    profiles: [check]
    command: ["npm", "run", "test:coverage"]
    tmpfs: [/tmp]
    environment:
      NODE_ENV: test
      RUN_INTEGRATION: "1"
      DATABASE_URL_FILE: /run/secrets/database_url
      MIGRATION_DATABASE_URL_FILE: /run/secrets/migration_database_url
      REDIS_URL_FILE: /run/secrets/redis_url_backend
      CSRF_SECRET_FILE: /run/secrets/csrf_secret
      DATA_ENCRYPTION_KEY_FILE: /run/secrets/data_encryption_key
      TRUST_PROXY: ${NGINX_IP:-172.31.10.10}
      APP_ORIGIN: https://localhost
      EDGE_BASE_URL: https://nginx:8443
      EDGE_HTTP_URL: http://nginx:8080
      EDGE_CA_FILE: /run/secrets/tls_cert
      EGRESS_PROXY: egress-proxy:3128
      NPM_CONFIG_UPDATE_NOTIFIER: "false"
    secrets: [database_url, migration_database_url, redis_url_backend, csrf_secret, data_encryption_key, tls_cert]
    networks: [edge, data, egress]
    depends_on:
      nginx:
        condition: service_healthy
      egress-proxy:
        condition: service_healthy

  # Database tests (database/tests) run in the tools image, which contains the
  # migrations and seeds. They need the owner and the runtime connections.
  tools:
    profiles: [tools, check]
    environment:
      NODE_ENV: test
      DATABASE_URL_FILE: /run/secrets/database_url
    secrets: [migration_database_url, database_url]

  # Browser check of the frontend (phase 7): official Playwright image, used
  # only here, like Trivy. It reaches nginx on the edge network.
  e2e:
    image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
    profiles: [check]
    working_dir: /repo
    shm_size: 512m
    environment:
      BASE_URL: https://nginx:8443
      E2E_USERNAME: e2e.admin
      E2E_PASSWORD_FILE: /run/e2e/password
    volumes:
      - .:/repo:ro
      - ${SECRETS_DIR:-./secrets}/e2e_admin_password:/run/e2e/password:ro
    networks: [edge]
    command: ["node", "e2e/run.mjs"]
    depends_on:
      nginx:
        condition: service_healthy

