# Check environment for scripts/check.sh: the production-like stack without
# published ports, plus a test container that reaches every internal network,
# and a SQL Server of its own (development and production use the
# organization's server, ADR-032).
services:
  nginx:
    ports: !reset []

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest@sha256:4525e3efac9f3e241cb003bb2ff2a82818b502f37e12049d788b1a9fa7e13b7f
    entrypoint: ["/bin/sh", "/usr/local/bin/enviotec-start.sh"]
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
    volumes:
      - ./infra/sqlserver/start.sh:/usr/local/bin/enviotec-start.sh:ro
    secrets: [database_admin_password, sqlserver_tls_cert, sqlserver_tls_key]
    networks: [database]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$(cat /run/secrets/database_admin_password)\" -Q 'SELECT 1' -b -o /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    deploy:
      resources:
        limits: { cpus: "2.00", memory: 2G }

  tests:
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: dev
    image: enviotec/backend:dev
    profiles: [check]
    command: ["npm", "run", "test:coverage"]
    tmpfs: [/tmp]
    environment:
      NODE_ENV: test
      RUN_INTEGRATION: "1"
      DATABASE_URL_FILE: /run/secrets/database_url
      MIGRATION_DATABASE_URL_FILE: /run/secrets/migration_database_url
      DATABASE_CA_CERT_FILE: /run/secrets/database_ca_cert
      DATABASE_SERVER_NAME: sqlserver
      REDIS_URL_FILE: /run/secrets/redis_url_backend
      CSRF_SECRET_FILE: /run/secrets/csrf_secret
      DATA_ENCRYPTION_KEY_FILE: /run/secrets/data_encryption_key
      TRUST_PROXY: ${NGINX_IP:-172.31.10.10}
      APP_ORIGIN: https://localhost
      EDGE_BASE_URL: https://nginx:8443
      EDGE_HTTP_URL: http://nginx:8080
      EDGE_CA_FILE: /run/secrets/tls_cert
      EGRESS_PROXY: egress-proxy:3128
      FILES_DIR: /data/files
      CLAMAV_HOST: clamav
      NPM_CONFIG_UPDATE_NOTIFIER: "false"
    volumes:
      - filestore:/data/files
    secrets: [database_url, migration_database_url, database_ca_cert, redis_url_backend, csrf_secret, data_encryption_key, tls_cert]
    networks: [edge, data, egress, files, database]
    depends_on:
      nginx:
        condition: service_healthy
      egress-proxy:
        condition: service_healthy
      file-processor:
        condition: service_started

  # Database tests (database/tests) run in the tools image, which contains the
  # migrations and seeds. They need the owner and the runtime connections;
  # provisioning, the administrative one of the check SQL Server.
  tools:
    profiles: [tools, check]
    environment:
      NODE_ENV: test
      DATABASE_URL_FILE: /run/secrets/database_url
      DATABASE_ADMIN_URL_FILE: /run/secrets/database_admin_url
    secrets: [migration_database_url, database_url, database_ca_cert, database_admin_url]

  # Browser check of the frontend (phase 7): official Playwright image, used
  # only here, like Trivy. It reaches nginx on the edge network.
  e2e:
    image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
    profiles: [check]
    working_dir: /repo
    shm_size: 512m
    environment:
      BASE_URL: https://nginx:8443
      E2E_USERNAME: e2e.admin
      E2E_PASSWORD_FILE: /run/e2e/password
    volumes:
      - .:/repo:ro
      - ${SECRETS_DIR:-./secrets}/e2e_admin_password:/run/e2e/password:ro
    networks: [edge]
    command: ["node", "e2e/run.mjs"]
    depends_on:
      nginx:
        condition: service_healthy

secrets:
  database_admin_password: { file: "${SECRETS_DIR:-./secrets}/database_admin_password" }
  database_admin_url: { file: "${SECRETS_DIR:-./secrets}/database_admin_url" }
  sqlserver_tls_cert: { file: "${SECRETS_DIR:-./secrets}/sqlserver_tls_cert" }
  sqlserver_tls_key: { file: "${SECRETS_DIR:-./secrets}/sqlserver_tls_key" }

networks:
  # The check SQL Server lives inside the stack: the database network needs
  # no route out, so it is internal here (the egress test proves it). In
  # development and production it reaches the organization's server, and the
  # host firewall limits it to that server's port.
  database:
    internal: true

volumes:
  # ClamAV signatures survive between runs (about 300 MB to download).
  clamavdb:
    external: true
    name: enviotec-clamav-db
